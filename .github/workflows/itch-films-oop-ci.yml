name: ITCH Films OOP CI

on:
  push:
    branches: [main]
    paths:
      - "itch_films_OOP/**"
      - ".github/workflows/itch-films-oop-ci.yml"
  pull_request:
    paths:
      - "itch_films_OOP/**"
      - ".github/workflows/itch-films-oop-ci.yml"

defaults:
  run:
    working-directory: itch_films_OOP

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Set up local_settings.py (dummy, tests are fully mocked)
        run: cp local_settings.example.py local_settings.py

      - name: Run unit tests
        run: python -m pytest tests/ --ignore=tests/test_itch_films.py -v
